name: Build CellCountX

on:
  push:
    tags:
      - 'v*'   # v1.0.0 や v0.9.0-beta などのタグでビルド

permissions:
  contents: write   # Release 作成に必須

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe のために必須

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------
      # Git タグからバージョン文字列を取得
      # ---------------------------------------------
      - name: Get version from tag
        id: get_version
        run: |
          $tag = git describe --tags --abbrev=0
          echo "version=$tag" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------
      # python-runtime（フル版用）を取得
      # ---------------------------------------------
      - name: Download python-runtime part1
        run: |
          curl -L -o site-packages.zip.001 `
            https://github.com/bpse-simulation/CellCountX/releases/download/python-runtime/site-packages.zip.001

      - name: Download python-runtime part2
        run: |
          curl -L -o site-packages.zip.002 `
            https://github.com/bpse-simulation/CellCountX/releases/download/python-runtime/site-packages.zip.002

      # ---------------------------------------------
      # 分割 zip を結合（cmd.exe）
      # ---------------------------------------------
      - name: Combine python-runtime zip
        shell: cmd
        run: |
          copy /b site-packages.zip.001 + site-packages.zip.002 site-packages.zip

      # ---------------------------------------------
      # site-packages.zip を展開（7z）
      # ---------------------------------------------
      - name: Extract python-runtime
        run: 7z x site-packages.zip -opython

      # ---------------------------------------------
      # csproj の InformationalVersion を書き換え
      # ---------------------------------------------
      - name: Replace InformationalVersion in csproj
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $path = "src/CellCountX.Wpf/CellCountX.Wpf.csproj"

          $xml = Get-Content $path

          # InformationalVersion が存在しない場合は追加
          if ($xml -notmatch "InformationalVersion") {
            $xml = $xml -replace "</PropertyGroup>", "  <InformationalVersion>$version</InformationalVersion>`n</PropertyGroup>"
          }
          else {
            $xml = $xml -replace "<InformationalVersion>.*</InformationalVersion>", "<InformationalVersion>$version</InformationalVersion>"
          }

          $xml | Set-Content $path -Encoding UTF8

      # ---------------------------------------------
      # Publish（フル版）
      # ---------------------------------------------
      - name: Publish Full
        run: dotnet publish src/CellCountX.Wpf/CellCountX.Wpf.csproj -c ReleaseFull -o publish_full

      # ---------------------------------------------
      # python runtime を publish_full に含める
      # ---------------------------------------------
      - name: Copy python runtime into publish_full
        run: |
          Copy-Item -Path python\* -Destination publish_full/python -Recurse

      # ---------------------------------------------
      # Publish（軽量版）
      # ---------------------------------------------
      - name: Publish Light
        run: dotnet publish src/CellCountX.Wpf/CellCountX.Wpf.csproj -c ReleaseLight -o publish_light

      # ---------------------------------------------
      # Release ノート自動生成（コミットログ）
      # ---------------------------------------------
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          current="${{ steps.get_version.outputs.version }}"

          # タグ一覧を version ソートで取得（安全）
          mapfile -t tags < <(git tag --sort=version:refname)

          # タグが1つもない場合
          if (( ${#tags[@]} == 0 )); then
            log="(no tags found)"
          else
            # current のインデックスを探す（grep を使わず安全に）
            idx=-1
            for i in "${!tags[@]}"; do
              if [[ "${tags[$i]}" == "$current" ]]; then
                idx=$i
                break
              fi
            done

            # current がタグ一覧に存在しない場合
            if (( idx == -1 )); then
              log="(current tag '$current' not found in tag list)"
            else
              # 前のタグを決定
              if (( idx == 0 )); then
                prev=""
              else
                prev="${tags[$((idx-1))]}"
              fi

              # コミットログ生成
              if [[ -z "$prev" ]]; then
                log="(no previous tag)"
              else
                log=$(git log "$prev".."$current" --pretty=format:"- %s (%h)")
                [[ -z "$log" ]] && log="(no commits between $prev and $current)"
              fi
            fi
          fi

          body="## Changes in $current

$log

_Automatically generated from commit history._"

          printf "body<<EOF\n%s\nEOF\n" "$body" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------
      # ZIP 作成（フル版）
      # ---------------------------------------------
      - name: Create split zip (Full)
        run: |
          7z a -tzip -v1900m CellCountX-${{ steps.get_version.outputs.version }}.zip publish_full\*

      # ---------------------------------------------
      # ZIP 作成（軽量版）
      # ---------------------------------------------
      - name: Create zip (Light)
        run: |
          7z a -tzip CellCountX-light-${{ steps.get_version.outputs.version }}.zip publish_light\*

      # ---------------------------------------------
      # Release にアップロード（フル版 + 軽量版）
      # ---------------------------------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CellCountX-${{ steps.get_version.outputs.version }}.zip*
            CellCountX-light-${{ steps.get_version.outputs.version }}.zip
          body: ${{ steps.notes.outputs.body }}
