name: Build CellCounter

on:
  push:
    tags:
      - 'v*'   # v1.0.0 や v0.9.0-beta などのタグでビルド

permissions:
  contents: write   # Release 作成に必須

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ---------------------------------------------
      # Checkout
      # ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe のために必須

      # ---------------------------------------------
      # Setup .NET
      # ---------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ---------------------------------------------
      # Git タグからバージョン文字列を取得
      # ---------------------------------------------
      - name: Get version from tag
        id: get_version
        run: |
          $tag = git describe --tags --abbrev=0
          echo "version=$tag" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------
      # csproj の InformationalVersion を書き換え
      # ---------------------------------------------
      - name: Replace InformationalVersion in csproj
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $path = "src/CellCountX.Wpf/CellCountX.Wpf.csproj"

          $xml = Get-Content $path

          # InformationalVersion が存在しない場合は追加
          if ($xml -notmatch "InformationalVersion") {
            $xml = $xml -replace "</PropertyGroup>", "  <InformationalVersion>$version</InformationalVersion>`n</PropertyGroup>"
          }
          else {
            $xml = $xml -replace "<InformationalVersion>.*</InformationalVersion>", "<InformationalVersion>$version</InformationalVersion>"
          }

          $xml | Set-Content $path -Encoding UTF8

      # ---------------------------------------------
      # Publish（軽量版のみ）
      # ---------------------------------------------
      - name: Publish
        run: dotnet publish src/CellCountX.Wpf/CellCountX.Wpf.csproj -c Release -o publish

      # ---------------------------------------------
      # Release ノート自動生成（コミットログ）
      # ---------------------------------------------
      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          # 現在のタグ
          $current = "${{ steps.get_version.outputs.version }}"

          # タグ一覧（version ソート）
          $tags = git tag --sort=version:refname | ForEach-Object { $_.Trim() }

          if ($tags.Count -eq 0) {
            $log = "(no tags found)"
          }
          else {
            # current のインデックス
            $idx = $tags.IndexOf($current)

            if ($idx -lt 0) {
              $log = "(current tag '$current' not found in tag list)"
            }
            else {
              # 前のタグ
              if ($idx -eq 0) {
                $prev = ""
              }
              else {
                $prev = $tags[$idx - 1]
              }

              if ([string]::IsNullOrEmpty($prev)) {
                $log = "(no previous tag)"
              }
              else {
                # git log は GitHub Actions の pwsh では常に配列として返る
                $logLines = git log "$prev..$current" --pretty=format:"- %s (%h)"

                if ($logLines.Count -eq 0) {
                  $log = "(no commits between $prev and $current)"
                }
                else {
                  $log = $logLines -join "`n"
                }
              }
            }
          }

          # Release ノート本文
          $body = "## Changes in $current`n`n$log`n`n_Automatically generated from commit history._"

          # 出力
          $body | Out-File release_notes.txt -Encoding utf8
          echo "body<<EOF" >> $env:GITHUB_OUTPUT
          Get-Content release_notes.txt >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      # ---------------------------------------------
      # ZIP 作成（軽量版のみ）
      # ---------------------------------------------
      - name: Create zip
        run: |
          7z a -tzip CellCountX-${{ steps.get_version.outputs.version }}.zip publish\*

      # ---------------------------------------------
      # Release にアップロード（軽量版のみ）
      # ---------------------------------------------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CellCountX-${{ steps.get_version.outputs.version }}.zip
          body: ${{ steps.notes.outputs.body }}
